<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CaterSmart AI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>" />
<meta name="claude:viewport-fit-sides" content="cover" />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
/>
<style>
  /* Layout: navy sidebar + scrolling workspace of cards; one section visible at a time */
  :root {
    --bg: #f2f6f4;
    --card: #ffffff;
    --ink: #0b1f3a;
    --muted: #566678;
    --line: #dae4e0;
    --accent: #047857;
    --accent-ink: #ffffff;
    --accent-soft: #d5f0e4;
    --side-bg: #0b1f3a;
    --side-ink: #e8eef6;
    --side-muted: #9fb0c6;
    --side-active: #14304f;
    --good: #047857;
    --good-soft: #d5f0e4;
    --warn: #9a5b00;
    --warn-soft: #fdefd2;
    --bad: #b42318;
    --bad-soft: #fde4e1;
    --info: #1b4fbf;
    --info-soft: #e1eafd;
    --neutral-soft: #e8eef1;
    --c1: #047857;
    --c2: #6ee7b7;
    --c3: #c5d0da;
    --c4: #e2574c;
    --shadow:
      0 1px 2px rgba(11, 31, 58, 0.06), 0 6px 18px rgba(11, 31, 58, 0.05);
    --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-head: "Space Grotesk", "Inter", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a1424;
      --card: #102038;
      --ink: #e7eef7;
      --muted: #97a8be;
      --line: #223650;
      --accent: #34d399;
      --accent-ink: #052018;
      --accent-soft: #12382f;
      --side-bg: #071120;
      --side-ink: #e8eef6;
      --side-muted: #8fa2ba;
      --side-active: #122743;
      --good: #4ade9e;
      --good-soft: #12382f;
      --warn: #f5b454;
      --warn-soft: #3a2b10;
      --bad: #f58b84;
      --bad-soft: #3e1b1f;
      --info: #8fb3ff;
      --info-soft: #17284a;
      --neutral-soft: #1a2d47;
      --c1: #34d399;
      --c2: #1b6b55;
      --c3: #3a4d66;
      --c4: #f28b82;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0a1424;
    --card: #102038;
    --ink: #e7eef7;
    --muted: #97a8be;
    --line: #223650;
    --accent: #34d399;
    --accent-ink: #052018;
    --accent-soft: #12382f;
    --side-bg: #071120;
    --side-ink: #e8eef6;
    --side-muted: #8fa2ba;
    --side-active: #122743;
    --good: #4ade9e;
    --good-soft: #12382f;
    --warn: #f5b454;
    --warn-soft: #3a2b10;
    --bad: #f58b84;
    --bad-soft: #3e1b1f;
    --info: #8fb3ff;
    --info-soft: #17284a;
    --neutral-soft: #1a2d47;
    --c1: #34d399;
    --c2: #1b6b55;
    --c3: #3a4d66;
    --c4: #f28b82;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    color-scheme: dark;
  }
  * {
    box-sizing: border-box;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.5;
  }
  h1,
  h2,
  h3,
  h4 {
    font-family: var(--font-head);
    margin: 0;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  h3 {
    font-size: 16px;
  }
  h4 {
    font-size: 14px;
  }
  p {
    margin: 0;
  }
  .layout {
    display: grid;
    grid-template-columns: 250px minmax(0, 1fr);
    min-height: 100vh;
  }
  .side {
    background: var(--side-bg);
    color: var(--side-ink);
    padding: 22px 14px 22px max(16px, env(safe-area-inset-left, 0px));
    display: flex;
    flex-direction: column;
    gap: 20px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  .brand {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .logo {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-ink);
    display: grid;
    place-items: center;
    font-family: var(--font-head);
    font-weight: 700;
  }
  .brand b {
    font-family: var(--font-head);
    font-size: 17px;
    display: block;
    line-height: 1.1;
  }
  .brand span {
    font-size: 11px;
    color: var(--side-muted);
  }
  .nav {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .nav button {
    display: flex;
    gap: 10px;
    align-items: center;
    text-align: left;
    background: none;
    border: 0;
    color: var(--side-muted);
    padding: 10px 12px;
    border-radius: 10px;
    font: inherit;
    font-weight: 500;
    cursor: pointer;
  }
  .nav button:hover {
    background: var(--side-active);
    color: var(--side-ink);
  }
  .nav button[aria-current="page"] {
    background: var(--side-active);
    color: var(--side-ink);
    box-shadow: inset 3px 0 0 var(--c2);
  }
  .side .foot {
    margin-top: auto;
    font-size: 11px;
    color: var(--side-muted);
    border-top: 1px solid var(--side-active);
    padding-top: 14px;
  }
  .ic {
    width: 18px;
    height: 18px;
    flex: none;
  }
  .main {
    padding: 22px max(24px, env(safe-area-inset-right, 0px)) 60px 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    min-width: 0;
  }
  .top {
    display: flex;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    align-items: flex-start;
  }
  .top h1 {
    font-size: 28px;
  }
  .top .sub {
    color: var(--muted);
    margin-top: 2px;
  }
  .tag {
    display: inline-block;
    margin-top: 8px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 3px 9px;
    border-radius: 99px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
    box-shadow: var(--shadow);
    min-width: 0;
  }
  .card.alert {
    border-width: 1px;
  }
  .card.alert.bad {
    background: var(--bad-soft);
    border-color: var(--bad);
  }
  .card.alert.good {
    background: var(--good-soft);
    border-color: var(--good);
  }
  .card.alert ul {
    margin: 8px 0 0;
    padding-left: 18px;
  }
  .grid {
    display: grid;
    gap: 16px;
    min-width: 0;
  }
  .g4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
  .g2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .g3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .metric .lab {
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .metric .val {
    font-family: var(--font-head);
    font-size: 30px;
    font-weight: 700;
    margin: 4px 0 2px;
    font-variant-numeric: tabular-nums;
  }
  .metric .sm {
    color: var(--muted);
  }
  .sm {
    font-size: 12px;
  }
  .muted {
    color: var(--muted);
  }
  .row {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .between {
    justify-content: space-between;
  }
  .wrap {
    flex-wrap: wrap;
  }
  .gap {
    gap: 12px;
  }
  .stack {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .btn {
    font: inherit;
    font-weight: 600;
    border-radius: 10px;
    border: 1px solid var(--line);
    padding: 9px 14px;
    cursor: pointer;
    background: var(--card);
    color: var(--ink);
  }
  .btn:hover {
    border-color: var(--accent);
  }
  .btn.pri {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }
  .btn.pri.lg {
    padding: 13px 20px;
    font-size: 15px;
    letter-spacing: 0.02em;
  }
  .btn.warn {
    background: var(--warn-soft);
    color: var(--warn);
    border-color: var(--warn);
  }
  .btn.bad {
    background: var(--bad-soft);
    color: var(--bad);
    border-color: var(--bad);
  }
  .btn.sec {
    background: var(--neutral-soft);
  }
  .btn.ghost {
    background: none;
  }
  .btn[disabled] {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .btn:focus-visible,
  input:focus-visible,
  select:focus-visible,
  textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 99px;
    white-space: nowrap;
  }
  .badge.good {
    background: var(--good-soft);
    color: var(--good);
  }
  .badge.warn {
    background: var(--warn-soft);
    color: var(--warn);
  }
  .badge.bad {
    background: var(--bad-soft);
    color: var(--bad);
  }
  .badge.info {
    background: var(--info-soft);
    color: var(--info);
  }
  .badge.neutral {
    background: var(--neutral-soft);
    color: var(--muted);
  }
  .f {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }
  .f span {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
  }
  input,
  select,
  textarea {
    font: inherit;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 8px 10px;
    width: 100%;
    min-width: 0;
  }
  textarea {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 12px;
    resize: vertical;
  }
  .tw {
    overflow-x: auto;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    font-variant-numeric: tabular-nums;
  }
  th,
  td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
    font-size: 13px;
  }
  th {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
  }
  td.n,
  th.n {
    text-align: right;
  }
  tr.hl td {
    background: var(--accent-soft);
  }
  tr.tot td {
    font-weight: 700;
    border-top: 2px solid var(--line);
  }
  .stackbar {
    display: flex;
    height: 22px;
    border-radius: 8px;
    overflow: hidden;
    background: var(--neutral-soft);
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
    margin-top: 10px;
    font-size: 12px;
    color: var(--muted);
  }
  .dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 3px;
    margin-right: 6px;
  }
  .bars {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .bp {
    height: 8px;
    border-radius: 6px;
    margin-top: 4px;
  }
  .steps {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .step {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .step .num {
    font-family: var(--font-head);
    font-weight: 700;
    min-width: 22px;
    color: var(--muted);
  }
  .log {
    max-height: 260px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 12px;
  }
  .log div {
    display: flex;
    gap: 10px;
  }
  .log time {
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    flex: none;
  }
  .pipe {
    display: grid;
    gap: 12px;
  }
  .pipe .st {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px;
    background: var(--bg);
  }
  .pipe .st h4 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .pipe blockquote {
    margin: 6px 0 0;
    padding: 8px 10px;
    border-left: 3px solid var(--accent);
    background: var(--card);
    border-radius: 0 8px 8px 0;
    font-size: 13px;
  }
  .stepper {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
  }
  .stepper div {
    padding: 8px;
    border-radius: 10px;
    border: 1px solid var(--line);
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    text-align: center;
  }
  .stepper div.on {
    background: var(--accent-soft);
    color: var(--good);
    border-color: var(--accent);
  }
  .stepper div.done {
    color: var(--good);
  }
  .chip {
    font: inherit;
    font-size: 12px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    padding: 6px 10px;
    border-radius: 99px;
    cursor: pointer;
  }
  .chip:hover {
    border-color: var(--accent);
  }
  .big {
    font-family: var(--font-head);
    font-size: 46px;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .toast {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    background: var(--ink);
    color: var(--bg);
    padding: 10px 16px;
    border-radius: 10px;
    font-weight: 600;
    z-index: 20;
    max-width: 90vw;
  }
  .chk {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 12px;
    border: 1px solid var(--warn);
    background: var(--warn-soft);
    border-radius: 12px;
  }
  .chk input {
    width: 18px;
    height: 18px;
    margin-top: 2px;
    flex: none;
  }
  ul.clean {
    margin: 6px 0 0;
    padding-left: 18px;
  }
  @media (max-width: 1100px) {
    .g4 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .g3 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }
  @media (max-width: 860px) {
    .layout {
      grid-template-columns: minmax(0, 1fr);
    }
    .side {
      position: static;
      height: auto;
      padding: 14px max(16px, env(safe-area-inset-right, 0px)) 10px
        max(16px, env(safe-area-inset-left, 0px));
      gap: 10px;
    }
    .nav {
      flex-direction: row;
      overflow-x: auto;
      gap: 6px;
      padding-bottom: 4px;
    }
    .nav button {
      white-space: nowrap;
      flex: none;
      padding: 8px 12px;
    }
    .side .foot {
      display: none;
    }
    .main {
      padding: 16px max(16px, env(safe-area-inset-right, 0px)) 50px
        max(16px, env(safe-area-inset-left, 0px));
    }
    .g2,
    .g3,
    .g4 {
      grid-template-columns: minmax(0, 1fr);
    }
    .top h1 {
      font-size: 24px;
    }
    .stepper {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }
  @media (max-width: 520px) {
    .g4 {
      grid-template-columns: minmax(0, 1fr);
    }
  }
</style>
</head>

      if (/previous|past|histor|support|similar/.test(ql))

        c.v.pending +

    if (id === "DOC-2") {
      const d = t.p.dish;
      if (d) {

              } catch (e) {}
              toast("Select the text and press Ctrl+C.");
              doRender();
            });
        } catch (e) {
          try {
            el.select();
          } catch (x) {}
          toast("Select the text and press Ctrl+C.");
        }
        return;
      }
      case "prepNgo": {
        const n = S.ngo,
          q = num(n.qty);
        if (!(q > 0)) {
          n.msg = "Enter a surplus quantity greater than 0.";
          break;
        }
        if (!n.date || !n.time || !n.loc.trim()) {
          n.msg = "Enter an event location, collection date and time.";
          break;
        }
        if (!n.verified) {
          n.msg =
            "Blocked: food safety has not been verified. A responsible person must confirm it with the checkbox before a request can be prepared.";
          act("NGO request blocked: food safety not verified by a human.");
          break;
        }
        const it = DISHES.find((d) => d.id === n.item),
          ng = NGOS.find((x) => x.id === n.ngoId);
        n.msg = "";
        n.status = "approval";
        n.request = [
          "SIMULATED NGO COLLECTION REQUEST — NOT SENT",
          "To: " + ng.name,
          "Food: " + fmt(q, 1) + " " + it.out + " of " + it.name,
          "Event: " + S.event.name,
          "Location: " + n.loc,
          "Collection: " + n.date + " at " + n.time,
          "Food safety: confirmed by a responsible person" +
            (n.verifier.trim() ? " (" + n.verifier.trim() + ")" : "") +
            " at " +
            nowT(),
          "Note: NGO availability is not confirmed. No message has been sent.",
        ].join("\n");
        tool(
          "prepare_ngo_collection",
          fmt(q, 1) + " " + it.out + " " + it.name + " → " + ng.name,
        );
        tool(
          "request_human_approval",
          "NGO collection request awaiting approval",
        );
        act(
          "NGO collection request prepared (simulated). Status: Awaiting Human Approval.",
        );
        break;
      }
      case "approveNgo":
        if (!S.ngo.verified) {
          S.ngo.msg = "Blocked: food safety verification is missing.";
          break;
        }
        if (S.ngo.status === "approval") {
          S.ngo.status = "prepared";
          S.ngo.msg = "";
          act(
            "Human approved the NGO collection request. Status: Request Prepared.",
          );
        }
        break;
      case "confirmNgo":
        if (S.ngo.status === "prepared") {
          S.ngo.status = "confirmed";
          act("Simulated collection confirmed. No real NGO was contacted.");
        }
        break;
      case "ask":
      case "ex": {
        if (a === "ex") {
          S.rag.q = [
            "How many guests should we expect?",
            "How much biryani should we prepare?",
            "What is the portion size for paneer?",
            "How do we adjust vendor orders?",
            "Can we donate surplus food without checking safety?",
            "Which previous events support the forecast?",
          ][Number(v)];
        }
        const q = S.rag.q.trim();
        if (!q) {
          toast("Type a question first.");
          break;
        }
        const docs = buildDocs(c),
          r = retrieve(q, docs),
          ok = r.hits.length && r.hits[0].score >= 1.8;
        S.rag.res = {
          q,
          terms: r.terms,
          hits: r.hits,
          answer: ok ? respond(q, r.hits, c) : "",
        };
        if (ok && r.hits[0].doc.id === "DOC-1")
          tool("retrieve_historical_events", "RAG query: " + q);
        act(
          'Knowledge query: "' +
            q +
            '" → ' +
            (ok ? r.hits[0].doc.name : "no matching evidence") +
            ".",
        );
        break;
      }
      case "doc":
        S.rag.open = S.rag.open === v ? null : v;
        break;
    }
    render();
  }
  function onBind(e) {
    const t = e.target,
      p = t.dataset && t.dataset.bind;
    if (!p) return;
    const val = t.type === "checkbox" ? t.checked : t.value,
      k = p.split(".");
    let o = S;
    for (let i = 0; i < k.length - 1; i++) o = o[k[i]];
    o[k[k.length - 1]] = val;
    if (k[0] === "ngo") {
      if (k[1] === "verified" && !val && S.ngo.status !== "safety") {
        S.ngo.status = "safety";
        S.ngo.request = null;
        S.ngo.msg =
          "Verification withdrawn. The request was reset and needs a new safety check.";
        act("NGO request reset: human safety verification withdrawn.");
      } else if (
        ["ngoId", "item", "qty"].includes(k[1]) &&
        S.ngo.status !== "safety"
      ) {
        S.ngo.status = "safety";
        S.ngo.verified = false;
        S.ngo.request = null;
        S.ngo.msg = "Food details changed. Please verify food safety again.";
        act("NGO request reset: food details changed, re-verification needed.");
      }
    }
    render();
  }
  document.addEventListener("click", (e) => {
    const b = e.target.closest && e.target.closest("[data-a]");
    if (!b || b.disabled) return;
    dispatch(b.dataset.a, b.dataset.v);
  });
  document.addEventListener("input", onBind);
  document.addEventListener("change", onBind);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.id === "rag.q") {
      e.preventDefault();
      dispatch("ask");
    }
  });
  doRender();
</script>
</body>
</html>
